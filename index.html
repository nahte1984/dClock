<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dClock | v1.5</title>
    
    <!-- 引入 Google Font: Zalando Sans Expanded Black 900 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:wght@900&display=swap" rel="stylesheet">
    
    <!-- 引入 Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #d5d5d3; 
            font-family: 'Zalando Sans Expanded', sans-serif;
            font-weight: 900;
            touch-action: none; /* 防止手機端拖曳時發生網頁滑動 */
        }

        .falling-text {
            position: absolute;
            top: 0; 
            left: 0;
            /* 移除了固定的 font-size，改由 JS 動態生成 */
            color: #ff25a0;
            letter-spacing: -0.075em; /* 縮小字距 */
            white-space: nowrap;
            user-select: none;
            line-height: 1;
            padding: 4px 6px; /* 配合字距稍微調小物理框左右寬度 */
            pointer-events: none; /* 讓滑鼠事件穿透，交由底層的 Canvas 處理物理拖曳 */
            will-change: transform;
        }

        /* 隱藏但覆蓋全螢幕的 Canvas，專門用來捕捉 Matter.js 的滑鼠/觸控事件 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            opacity: 0; 
        }

        /* 啟動按鈕 */
        #start-btn {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 20px; /* 加大表情符號 */
            background: #d5d5d3;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        
        #start-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
    </style>
</head>
<body>

    <button id="start-btn">🥲</button>
    <video id="webcam" autoplay playsinline muted style="display: none;"></video>

    <script>
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint;

        const engine = Engine.create();
        const world = engine.world;
        const boxes = []; // 儲存 DOM 元素與物理 Body 的對應關係
        let render, runner;
        let videoReady = false; // 追蹤相機是否就緒
        let vacuumActive = false; // 追蹤「大引力黑洞」是否正在作動

        const startBtn = document.getElementById('start-btn');
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        // 綁定啟動按鈕
        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none'; // 立即隱藏按鈕避免重複點擊

            // 請求 iOS 13+ 的陀螺儀權限
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        console.warn('陀螺儀權限未授權');
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            // 請求前鏡頭相機權限
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                
                // 等待相機載入完成後啟動
                video.onloadedmetadata = () => {
                    video.play();
                    videoReady = true;
                    init();
                };
            } catch (err) {
                console.error("相機權限遭拒絕或無相機設備:", err);
                init(); // 若無相機，仍啟動物理引擎（使用預設粉紅色字體）
            }
        });

        function init() {
            // 確保字型載入完成後再生成物理框，避免尺寸計算錯誤
            document.fonts.ready.then(() => {
                setupMatter();
                setupBoundaries();
                setupMouseInteraction();
                setupGyroscope();

                runner = Runner.create();
                Runner.run(runner, engine);

                requestAnimationFrame(renderLoop);
                startInitialDrops();
            });
        }

        function setupMatter() {
            render = Render.create({
                element: document.body,
                engine: engine,
                options: {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    wireframes: false,
                    background: 'transparent'
                }
            });
            Render.run(render);
        }

        let floor, ceiling, leftWall, rightWall;
        function setupBoundaries() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const thick = 100; // 邊界厚度

            // 建立四周的牆壁，確保文字不會飛出畫面
            floor = Bodies.rectangle(w / 2, h + thick / 2, w + 200, thick, { isStatic: true });
            ceiling = Bodies.rectangle(w / 2, -thick / 2, w + 200, thick, { isStatic: true }); // 新增天花板
            leftWall = Bodies.rectangle(-thick / 2, h / 2, thick, h * 2, { isStatic: true });
            rightWall = Bodies.rectangle(w + thick / 2, h / 2, thick, h * 2, { isStatic: true });
            
            Composite.add(world, [floor, ceiling, leftWall, rightWall]);
        }

        // 監聽視窗大小改變，即時更新四周邊界位置
        window.addEventListener('resize', () => {
            if (!render) return;
            const w = window.innerWidth;
            const h = window.innerHeight;
            render.canvas.width = w;
            render.canvas.height = h;
            
            Matter.Body.setPosition(floor, { x: w / 2, y: h + 50 });
            Matter.Body.setPosition(ceiling, { x: w / 2, y: -50 });
            Matter.Body.setPosition(leftWall, { x: -50, y: h / 2 });
            Matter.Body.setPosition(rightWall, { x: w + 50, y: h / 2 });
        });

        function setupMouseInteraction() {
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.2,
                    render: { visible: false }
                }
            });
            Composite.add(world, mouseConstraint);
            render.mouse = mouse; // 保持滑鼠位置與渲染同步
        }

        function setupGyroscope() {
            window.addEventListener('deviceorientation', (event) => {
                if (vacuumActive) return; // 若大引力黑洞作用中，暫停陀螺儀干擾

                const gamma = event.gamma; // 左右傾斜
                const beta = event.beta;   // 前後傾斜

                if (gamma !== null && beta !== null) {
                    // 根據傾斜角度動態調整重力向量 (限制在 -1 到 1 之間)
                    engine.gravity.x = Math.max(-1, Math.min(1, gamma / 45));
                    // 考慮到平常拿手機的角度，適度調整 beta 基準
                    engine.gravity.y = Math.max(-1, Math.min(1, beta / 45)); 
                }
            });
        }

        // 吸塵器/黑洞功能：將當前所有數字轉為感測器並用強大重力吸出畫面外
        function suckAllDown() {
            vacuumActive = true;

            // 臨時將世界引力放大，並強制垂直向下
            engine.gravity.y = 3.5; 
            engine.gravity.x = 0;

            boxes.forEach(box => {
                if (!box.isVacuumed) {
                    box.isVacuumed = true; // 標記為即將被清除
                    // isSensor: true 讓剛體可以穿過牆壁和地板，不受碰撞影響
                    Matter.Body.set(box.body, 'isSensor', true);
                    // 給予初始向下的衝力
                    Matter.Body.setVelocity(box.body, { x: 0, y: 25 });
                }
            });

            // 1.5 秒後恢復正常重力
            setTimeout(() => {
                vacuumActive = false;
                engine.gravity.y = 1; // 回復預設重力 1 (陀螺儀很快會再蓋過它)
            }, 1500);

            // 2.5 秒後將已經掉出畫面的物件從記憶體徹底清除
            setTimeout(() => {
                for (let i = boxes.length - 1; i >= 0; i--) {
                    if (boxes[i].isVacuumed) {
                        Composite.remove(world, boxes[i].body);
                        boxes[i].el.remove();
                        boxes.splice(i, 1);
                    }
                }
            }, 2500);
        }

        // 處理畫面載入時的初始時間掉落
        function startInitialDrops() {
            const d = new Date();
            let h = d.getHours();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            h = h ? h : 12; // 12小時制處理
            
            const m = d.getMinutes().toString().padStart(2, '0');
            const s = d.getSeconds().toString().padStart(2, '0');
            const month = monthNames[d.getMonth()];
            const date = d.getDate();

            // 依據新需求，分成日期、時間、AM/PM 三個部分
            const dateString = `${month} ${date}`;
            const timeString = `${h}:${m}:${s}`;
            const parts = [dateString, timeString, ampm];

            let dropIndex = 0;
            const dropInterval = setInterval(() => {
                if (dropIndex < parts.length) {
                    spawnTextBody(parts[dropIndex]);
                    dropIndex++;
                } else {
                    clearInterval(dropInterval);
                    startClock(); // 初始掉落完畢後，啟動時鐘機制
                }
            }, 350); // 每 350 毫秒掉落一個字塊
        }

        let lastTime;
        function startClock() {
            lastTime = new Date();
            
            // 每 100 毫秒檢查一次時間，確保精準度
            setInterval(() => {
                const now = new Date();
                const drops = [];
                const currentSec = now.getSeconds();

                // 如果秒數改變了
                if (currentSec !== lastTime.getSeconds()) {
                    // 每 20 秒觸發一次超級重力吸收！ (00, 20, 40)
                    if (currentSec % 20 === 0) {
                        suckAllDown();
                    }

                    // 如果分數也改變了，加入分數
                    if (now.getMinutes() !== lastTime.getMinutes()) {
                        drops.push(now.getMinutes().toString().padStart(2, '0'));
                    }
                    // 加入秒數
                    drops.push(currentSec.toString().padStart(2, '0'));
                    lastTime = now;
                }

                // 將變更的數字依序掉落
                drops.forEach((text, i) => {
                    setTimeout(() => {
                        spawnTextBody(text);
                    }, i * 300);
                });

            }, 100); 
        }

        // 擷取相機特定區域畫面的函數
        function getCameraSnapshot(x, y, w, h) {
            if (!videoReady) return null;
            const video = document.getElementById('webcam');
            
            // 建立暫時畫布模擬全螢幕
            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = window.innerWidth;
            snapCanvas.height = window.innerHeight;
            const snapCtx = snapCanvas.getContext('2d');
            
            // 計算 Object-fit: cover 比例
            const videoRatio = video.videoWidth / video.videoHeight;
            const windowRatio = window.innerWidth / window.innerHeight;
            let drawW, drawH, drawX, drawY;
            if (windowRatio > videoRatio) {
                drawW = window.innerWidth;
                drawH = window.innerWidth / videoRatio;
                drawX = 0;
                drawY = (window.innerHeight - drawH) / 2;
            } else {
                drawW = window.innerHeight * videoRatio;
                drawH = window.innerHeight;
                drawX = (window.innerWidth - drawW) / 2;
                drawY = 0;
            }
            
            // 鏡像翻轉（前鏡頭習慣視覺）
            snapCtx.translate(snapCanvas.width, 0);
            snapCtx.scale(-1, 1);
            snapCtx.drawImage(video, drawX, drawY, drawW, drawH);
            snapCtx.setTransform(1, 0, 0, 1, 0, 0);
            
            // 建立裁切用的畫布
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = Math.max(1, Math.ceil(w));
            cropCanvas.height = Math.max(1, Math.ceil(h));
            const cropCtx = cropCanvas.getContext('2d');
            
            // 從全畫面截圖中，取出文字所在範圍的影像
            cropCtx.drawImage(snapCanvas, x, y, w, h, 0, 0, w, h);
            
            return cropCanvas.toDataURL('image/jpeg', 0.9);
        }

        // 生成單一個文字及其物理 Body
        function spawnTextBody(text) {
            const el = document.createElement('div');
            el.className = 'falling-text';
            el.innerText = text;
            
            // 依照當下的秒數計算字級大小 (0秒時 31px，59秒時 90px)
            const currentSec = new Date().getSeconds();
            const dynamicFontSize = 31 + currentSec;
            el.style.fontSize = `${dynamicFontSize}px`;

            document.body.appendChild(el);

            // 取得該文字在 DOM 中的實際寬高 (包含 padding)
            const width = el.offsetWidth;
            const height = el.offsetHeight;

            // 隨機決定 X 軸生成位置，確保不會超出畫面
            const margin = 20;
            const maxX = Math.max(margin, window.innerWidth - width - margin);
            const x = margin + Math.random() * (Math.max(0, maxX - margin)); 
            
            // 從畫面內部頂端（y = 30）的地方生成
            const y = 30; 

            // 若相機有畫面，將該區域的影像貼在文字表面
            const imgData = getCameraSnapshot(x, y, width, height);
            if (imgData) {
                el.style.backgroundImage = `url(${imgData})`;
                el.style.backgroundPosition = 'center';
                el.style.backgroundSize = 'cover';
                el.style.color = 'transparent'; // 讓文字本體變透明
                el.style.webkitBackgroundClip = 'text'; // 讓背景只顯示在文字上
                el.style.backgroundClip = 'text';
            }

            // 建立 Matter.js 矩形物理剛體
            const body = Bodies.rectangle(x + width / 2, y + height / 2, width, height, {
                restitution: 0.7, // 彈性 (碰撞會彈跳)
                friction: 0.1,    // 摩擦力
                density: 0.002    // 密度
            });

            Composite.add(world, body);
            boxes.push({ el, body, width, height });

            // 效能保護：超過 100 個時進行常規的清理 (通常因為 20 秒大清空，不會達到這個數量)
            if (boxes.length > 100) {
                const oldest = boxes.shift();
                Composite.remove(world, oldest.body);
                oldest.el.remove();
            }
        }

        // 渲染迴圈：將 Matter.js 的物理坐標同步到 DOM 元素的 CSS transform
        function renderLoop() {
            boxes.forEach(box => {
                const { x, y } = box.body.position;
                const angle = box.body.angle;
                // Matter.js 是以中心點為坐標，而 DOM 是以左上角為起點，所以需要平移寬高的一半
                box.el.style.transform = `translate(${x - box.width / 2}px, ${y - box.height / 2}px) rotate(${angle}rad)`;
            });
            requestAnimationFrame(renderLoop);
        }
    </script>
</body>
</html>
